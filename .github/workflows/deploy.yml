name: Deploy Laravel - ModernizeTech (Webuzo)

on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: 'Domínio completo (ex: cliente1.seudominio.com.br)'
        required: true

      db_host:
        description: 'Database host'
        required: true
        default: 'localhost'

      db_database:
        description: 'Database name'
        required: true

      db_username:
        description: 'Database username'
        required: true

      db_password:
        description: 'Database password'
        required: true

      repository_url:
        description: 'Repository SSH URL'
        required: true
        default: 'git@github.com:ModernizeTechOficial/saas_cyzor_erp.git'

      sql_file_path:
        description: 'Caminho do dump SQL dentro do repositório'
        required: false
        default: 'database/dump.sql'

      purchase_id:
        description: 'ID da compra'
        required: false
        default: 'não encontrado'

      ssh_key_name:
        description: 'Nome do arquivo da chave privada SSH'
        required: false
        default: 'vendas_crm'

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PURCHASE_ID: ${{ github.event.inputs.purchase_id }}
      SUBDOMAIN: ${{ github.event.inputs.subdomain }}
      API_URL: https://cyzor.com.br/api/github/deploy-step
      PHP_BIN: /usr/local/apps/php83/bin/php

    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Notificar API (início)
        run: |
          curl -X POST "https://cyzor.com.br/api/github/webhook" \
            -H "Content-Type: application/json" \
            -d "{\"purchase_id\":\"${{ env.PURCHASE_ID }}\",\"subdomain\":\"${{ env.SUBDOMAIN }}\"}"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY_RSA }}" > ~/.ssh/${{ github.event.inputs.ssh_key_name }}
          chmod 600 ~/.ssh/${{ github.event.inputs.ssh_key_name }}
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy remoto (Webuzo)
        run: |
          ssh -i ~/.ssh/${{ github.event.inputs.ssh_key_name }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << EOF

          set -e

          notify() {
            curl -X POST "${{ env.API_URL }}" \
              -H "Content-Type: application/json" \
              -d "{
                \"purchase_id\":\"${{ env.PURCHASE_ID }}\",
                \"subdomain\":\"${{ env.SUBDOMAIN }}\",
                \"step\":\"\$1\",
                \"status\":\"\$2\",
                \"percent\":\$3
              }" || true
          }

          notify "Iniciando deploy" "in_progress" 5

          TARGET_DIR="/home/${{ github.event.inputs.subdomain }}/public_html"
          PHP_BIN="${{ env.PHP_BIN }}"

          mkdir -p "\$TARGET_DIR"
          cd "\$TARGET_DIR"

          # Backup
          notify "Backup" "in_progress" 10
          if [ -n "\$(ls -A . 2>/dev/null)" ]; then
            tar -czf "../backup_\$(date +%F_%H-%M-%S).tar.gz" ./*
            rm -rf ./*
          fi
          notify "Backup concluído" "completed" 15

          # Clone do repositório
          notify "Clonando repositório" "in_progress" 20
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/${{ github.event.inputs.ssh_key_name }} -o StrictHostKeyChecking=no"
          git clone "${{ github.event.inputs.repository_url }}" .
          notify "Repositório clonado" "completed" 25

          # Configuração do .env
          notify "Configurando .env" "in_progress" 30
          cp .env.example .env
          sed -i "s|APP_URL=.*|APP_URL=https://${{ github.event.inputs.subdomain }}|g" .env
          sed -i "s|DB_HOST=.*|DB_HOST=${{ github.event.inputs.db_host }}|g" .env
          sed -i "s|DB_DATABASE=.*|DB_DATABASE=${{ github.event.inputs.db_database }}|g" .env
          sed -i "s|DB_USERNAME=.*|DB_USERNAME=${{ github.event.inputs.db_username }}|g" .env
          sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=${{ github.event.inputs.db_password }}|g" .env
          notify ".env configurado" "completed" 35

          # Virtual Host (Webuzo / LSWS)
          notify "Aplicando Virtual Host" "in_progress" 40
          TEMPLATE="\$TARGET_DIR/.github/templates/vhconf.template"
          if [ -f "\$TEMPLATE" ]; then
            sudo mkdir -p "/usr/local/lsws/conf/vhosts/${{ github.event.inputs.subdomain }}"
            sudo cp "\$TEMPLATE" "/usr/local/lsws/conf/vhosts/${{ github.event.inputs.subdomain }}/vhconf.conf"
            sudo sed -i "s|{{DOMAIN}}|${{ github.event.inputs.subdomain }}|g" "/usr/local/lsws/conf/vhosts/${{ github.event.inputs.subdomain }}/vhconf.conf"
            sudo sed -i "s|{{PUBLIC_DIR}}|\$TARGET_DIR/public|g" "/usr/local/lsws/conf/vhosts/${{ github.event.inputs.subdomain }}/vhconf.conf"
            sudo /usr/local/lsws/bin/lswsctrl reload
          fi
          notify "Virtual Host aplicado" "completed" 45

          # Permissões
          notify "Permissões" "in_progress" 50
          USUARIO=\$(whoami)
          sudo chown -R "\$USUARIO:\$USUARIO" .
          sudo find . -type d -exec chmod 755 {} \;
          sudo find . -type f -exec chmod 644 {} \;
          sudo chmod -R 775 storage bootstrap/cache
          notify "Permissões OK" "completed" 55

          # Dependências
          notify "Instalando dependências" "in_progress" 60
          if command -v composer >/dev/null; then
            composer install --no-interaction --optimize-autoloader
          elif [ -f composer.phar ]; then
            \$PHP_BIN composer.phar install --no-interaction --optimize-autoloader
          fi

          if command -v npm >/dev/null && [ -f package.json ]; then
            npm ci
          fi
          notify "Dependências instaladas" "completed" 70

          # Laravel
          notify "Configurando Laravel" "in_progress" 75
          \$PHP_BIN artisan key:generate --force
          \$PHP_BIN artisan storage:link || true
          \$PHP_BIN artisan optimize:clear || true
          notify "Laravel configurado" "completed" 80

          # Banco de dados
          notify "Banco de dados" "in_progress" 85
          SQL_FILE="\$TARGET_DIR/${{ github.event.inputs.sql_file_path }}"
          if [ -f "\$SQL_FILE" ]; then
            mysql --protocol=TCP \
              -h "${{ github.event.inputs.db_host }}" \
              -u "${{ github.event.inputs.db_username }}" \
              -p"${{ github.event.inputs.db_password }}" \
              "${{ github.event.inputs.db_database }}" < "\$SQL_FILE"
            notify "Banco importado" "completed" 90
          else
            notify "Sem dump SQL" "skipped" 90
          fi

          sudo /usr/local/lsws/bin/lswsctrl reload
          notify "Deploy concluído com sucesso" "completed" 100

          EOF
